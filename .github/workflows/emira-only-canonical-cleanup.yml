name: One-shot Emira-only canonical cleanup

on:
  push:
    branches: [gh-pages]
    paths:
      - ".github/workflows/emira-only-canonical-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Canonicalize public visibility
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def matching_end(text, start, tag):
              token = re.compile(rf'<{tag}\b|</{tag}\s*>', re.I)
              depth = 0
              for match in token.finditer(text, start):
                  if match.group(0).lower().startswith(f'</{tag}'):
                      depth -= 1
                  else:
                      depth += 1
                  if depth == 0:
                      return match.end()
              raise RuntimeError(f'unmatched <{tag}> starting at {start}')

          def element_span_by_id(text, tag, element_id):
              start_match = re.search(
                  rf'<{tag}\b[^>]*\bid=["\']{re.escape(element_id)}["\'][^>]*>',
                  text,
                  re.I,
              )
              if not start_match:
                  raise RuntimeError(f'missing {tag}#{element_id}')
              return start_match.start(), matching_end(text, start_match.start(), tag)

          def remove_element_by_id(text, tag, element_id):
              start, end = element_span_by_id(text, tag, element_id)
              while start > 0 and text[start - 1] in ' \t':
                  start -= 1
              if start > 0 and text[start - 1] == '\n':
                  start -= 1
              return text[:start] + text[end:]

          index_path = Path('index.html')
          html = index_path.read_text()

          replacements = {
              '<title>Fox &amp; Moss | Emira, Wordleaf, Nalia and Storage Guard</title>': '<title>Fox &amp; Moss | Emira</title>',
              '<meta name="description" content="Fox & Moss makes Emira, Wordleaf, Nalia, and Storage Guard: calm, accessible software for life planning, writing, hands-free computer use, and storage health.">': '<meta name="description" content="Fox & Moss makes Emira, a calm native iPhone and iPad life calendar for goals, memories, journaling, reflection, time capsules, and relaxing games.">',
              '<meta property="og:description" content="Emira is a native iOS life calendar. Wordleaf is a free voice-first writing app. Nalia is an accessibility-first desktop assistant. Storage Guard keeps local drives readable and healthy.">': '<meta property="og:description" content="Emira is a calm native iPhone and iPad life calendar for goals, memories, journaling, reflection, time capsules, and relaxing games.">',
              '<meta name="twitter:description" content="Fox & Moss makes Emira, Wordleaf, Nalia, and Storage Guard.">': '<meta name="twitter:description" content="Fox & Moss makes Emira, a calm native iPhone and iPad life calendar.">',
              '<p>Fox &amp; Moss is home to Emira, Wordleaf, Nalia, and Storage Guard. They are different tools, but they share the same idea: software should make ordinary things easier without making you fight the interface.</p>': '<p>Fox &amp; Moss is home to Emira, a calm life calendar for goals, memories, journaling, reflection, time capsules, and little relaxing games.</p>',
          }
          for old, new in replacements.items():
              if old not in html:
                  raise RuntimeError(f'expected index.html text missing: {old[:80]}')
              html = html.replace(old, new, 1)

          html, nav_count = re.subn(
              r'\n\s*<li><a href="#(?:wordleaf|nalia|storage-guard)">[^<]+</a></li>',
              '',
              html,
          )
          if nav_count != 3:
              raise RuntimeError(f'expected 3 unpublished root nav items, removed {nav_count}')

          home_start, home_end = element_span_by_id(html, 'section', 'home')
          home = html[home_start:home_end]
          points_match = re.search(r'<div class="app-points">', home)
          if not points_match:
              raise RuntimeError('missing home app-points block')
          points_start = home_start + points_match.start()
          points_end = matching_end(html, points_start, 'div')
          emira_points = '''<div class="app-points">
              <div>
                <h3>Emira</h3>
                <p>A calm life calendar for goals, memories, journaling, reflection, time capsules, and little relaxing games. No streaks or productivity scores.</p>
                <p><a href="./emira/">Read about Emira</a></p>
              </div>
            </div>'''
          html = html[:points_start] + emira_points + html[points_end:]

          for region in ('wordleaf', 'nalia', 'storage-guard'):
              html = remove_element_by_id(html, 'section', region)

          index_path.write_text(html)

          # Keep the old unpublished hashes graceful, but remove JS-only hiding and
          # runtime metadata rewriting now that the canonical HTML is correct.
          script_path = Path('script.js')
          script = script_path.read_text()
          script = script.replace(
              "  var unpublishedRegions = ['#wordleaf', '#nalia', '#storage-guard'];",
              "  var legacyUnpublishedRegions = ['#wordleaf', '#nalia', '#storage-guard'];",
              1,
          )
          marker_start = script.find('  // Wordleaf, Nalia, and Storage Guard are intentionally kept in the source')
          marker_end = script.find('  function showRegion()', marker_start)
          if marker_start < 0 or marker_end < 0:
              raise RuntimeError('could not locate temporary Emira-only JS gate')
          script = script[:marker_start] + '  // Old unpublished homepage hashes fall back to Emira.\n' + script[marker_end:]
          script = script.replace('unpublishedRegions.indexOf(region)', 'legacyUnpublishedRegions.indexOf(region)')
          script = script.replace('    applyEmiraOnlyPublicView();\n', '')
          if 'applyEmiraOnlyPublicView' in script or 'unpublishedRegions.indexOf' in script:
              raise RuntimeError('temporary runtime visibility gate still present')
          script_path.write_text(script)

          # Preserve unpublished product pages, but make them non-indexable and
          # remove cross-product discovery from their navigation.
          for page in (Path('wordleaf/index.html'), Path('nalia/index.html')):
              page_html = page.read_text()
              page_html, robot_count = re.subn(
                  r'<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">',
                  '<meta name="robots" content="noindex, nofollow">',
                  page_html,
                  count=1,
              )
              if robot_count != 1:
                  raise RuntimeError(f'{page}: expected index/follow robots tag')
              page_html, menu_count = re.subn(
                  r'<ul class="main-menu">.*?</ul>',
                  '<ul class="main-menu">\n          <li><a href="../">Home</a></li>\n          <li><a href="../emira/">Emira</a></li>\n        </ul>',
                  page_html,
                  count=1,
                  flags=re.S,
              )
              if menu_count != 1:
                  raise RuntimeError(f'{page}: expected one main menu')
              page.write_text(page_html)

          Path('sitemap.xml').write_text('''<?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>https://foxandmoss.github.io/home/</loc>
              <lastmod>2026-10-31</lastmod>
            </url>
            <url>
              <loc>https://foxandmoss.github.io/home/emira/</loc>
              <lastmod>2026-10-31</lastmod>
            </url>
          </urlset>
          '''.replace('          ', ''))

          verify_path = Path('.github/workflows/verify-downloads.yml')
          verify = verify_path.read_text()
          old_checks = '''          grep -q "downloads/apps.json" script.js
          grep -q 'data-download-app="wordleaf"' index.html
          grep -q 'data-download-app="nalia"' index.html
          grep -q 'data-download-app="storage-guard"' index.html
'''
          new_checks = '''          grep -q "downloads/apps.json" script.js
          grep -q 'data-download-label="emira:ios"' index.html
          if grep -Eq 'href="[^"#]*(wordleaf|nalia)/|href="#(wordleaf|nalia|storage-guard)"|data-download-app="(wordleaf|nalia|storage-guard)"' index.html; then
            echo "Unpublished product discovery leaked into index.html" >&2
            exit 1
          fi
'''
          if old_checks not in verify:
              raise RuntimeError('stale download-page assertions not found')
          verify_path.write_text(verify.replace(old_checks, new_checks, 1))

          authority_path = Path('WEBSITE-AUTHORITY.md')
          authority = authority_path.read_text()
          authority = authority.replace(
              'The source still contains older `Fox & Moss` naming and hidden product copy. That is migration debt, not evidence that the current direction changed.',
              'The source still contains older `Fox & Moss` naming. That is migration debt, not evidence that the current direction changed. The Emira-only canonical visibility cleanup has removed unpublished product discovery from the root HTML and sitemap while preserving the dedicated source pages as noindex/nofollow.',
          )
          authority = authority.replace(
              'Commit `4072c96154e7c2edf2655653ab1714a40cc79929` implemented Emira-only presentation mainly in `script.js`. Static `index.html` still contains/advertises the other products and old metadata.\n\nTherefore:\n\n- runtime presentation may show Emira only;\n- no-JS/static/crawler-visible source can still disagree;\n- dynamic `document.title`/meta replacement is not canonical source cleanup;\n- WEB-001 records this as an observed source/authority conflict to route into the proper implementation Working.',
              'Commit `4072c96154e7c2edf2655653ab1714a40cc79929` originally implemented Emira-only presentation mainly in `script.js`. On 2026-10-31, direct user instruction authorized the canonical visibility cleanup: root HTML now exposes Emira only, the temporary runtime metadata/hiding gate was removed, unpublished product pages were preserved with noindex/nofollow, and old unpublished hash routes fall back to Emira.',
          )
          authority = authority.replace(
              '- `sitemap.xml` still lists `/wordleaf/` and `/nalia/`, so crawler-visible route truth does not yet match the Emira-only public direction.\n- `.github/workflows/verify-downloads.yml` currently requires Wordleaf, Nalia, and Storage Guard `data-download-app` markers in `index.html`. A canonical HTML cleanup must update the validator in the same audit rather than preserving stale HTML to satisfy stale CI.',
              '- `sitemap.xml` now lists only the root and Emira canonical routes; unpublished Wordleaf/Nalia routes are no longer advertised there.\n- `.github/workflows/verify-downloads.yml` now validates the Emira root marker and rejects unpublished product links/download markers in `index.html` instead of requiring stale hidden-product markup.',
          )
          authority_path.write_text(authority)
          PY

      - name: Validate Emira-only discovery contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          html = Path('index.html').read_text()
          forbidden = [
              r'href="#wordleaf"', r'href="#nalia"', r'href="#storage-guard"',
              r'href="./wordleaf/"', r'href="./nalia/"',
              r'data-download-app="wordleaf"', r'data-download-app="nalia"',
              r'data-download-app="storage-guard"',
              r'<section id="wordleaf"', r'<section id="nalia"', r'<section id="storage-guard"',
          ]
          leaked = [pattern for pattern in forbidden if re.search(pattern, html)]
          if leaked:
              raise SystemExit(f'index.html still exposes unpublished product surfaces: {leaked}')
          for name in ('Wordleaf', 'Nalia', 'Storage Guard'):
              if name in html.split('</head>', 1)[0]:
                  raise SystemExit(f'root metadata still names unpublished product: {name}')
          if 'data-download-label="emira:ios"' not in html:
              raise SystemExit('Emira availability marker missing from root')

          sitemap = Path('sitemap.xml').read_text()
          ET.fromstring(sitemap)
          if '/wordleaf/' in sitemap or '/nalia/' in sitemap or 'storage-guard' in sitemap:
              raise SystemExit('sitemap still advertises unpublished products')

          for page in ('wordleaf/index.html', 'nalia/index.html'):
              body = Path(page).read_text()
              if '<meta name="robots" content="noindex, nofollow">' not in body:
                  raise SystemExit(f'{page} is not noindex/nofollow')
              menu = re.search(r'<ul class="main-menu">(.*?)</ul>', body, re.S)
              if not menu or 'wordleaf' in menu.group(1).lower() or 'nalia' in menu.group(1).lower():
                  raise SystemExit(f'{page} navigation still cross-exposes unpublished products')
          print('Emira-only discovery contract OK')
          PY

          git diff --check

      - name: Commit canonical visibility cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html script.js sitemap.xml wordleaf/index.html nalia/index.html .github/workflows/verify-downloads.yml WEBSITE-AUTHORITY.md
          git diff --cached --exit-code && { echo "No cleanup changes produced"; exit 1; } || true
          git commit -m "Hide unpublished products from public discovery"
          git push origin HEAD:gh-pages
