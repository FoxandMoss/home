name: Verify public app downloads

on:
  push:
    branches: [gh-pages]
    paths:
      - "downloads/apps.json"
      - "downloads/release-policy.json"
      - "index.html"
      - "script.js"
      - ".github/workflows/verify-downloads.yml"
  schedule:
    - cron: "7 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Validate manifest structure
        shell: bash
        run: |
          set -euo pipefail
          jq empty downloads/apps.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("downloads/apps.json").read_text())
          required = {
              ("wordleaf", "windows"),
              ("nalia", "windows"),
              ("storage-guard", "windows"),
              ("wordleaf", "mac"),
              ("nalia", "mac"),
              ("storage-guard", "mac"),
              ("emira", "ios"),
          }
          missing = [(a,p) for a,p in required if p not in data.get(a,{})]
          if missing:
              raise SystemExit(f"Missing download entries: {missing}")

          for app, platforms in data.items():
              for platform, entry in platforms.items():
                  status = entry.get("status")
                  if status not in {"available", "coming_soon"}:
                      raise SystemExit(f"{app}/{platform}: invalid status {status!r}")
                  if status == "available" and not entry.get("url"):
                      raise SystemExit(f"{app}/{platform}: available entry has no URL")
          PY

      - name: Verify every available endpoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          from pathlib import Path
          from urllib.parse import urljoin

          data = json.loads(Path("downloads/apps.json").read_text())
          base = "https://foxandmoss.github.io/home/"
          for app, platforms in data.items():
              for platform, entry in platforms.items():
                  if entry.get("status") != "available":
                      continue
                  url = urljoin(base, entry["url"])
                  print(f"Checking {app}/{platform}: {url}")
                  req = urllib.request.Request(url, method="HEAD", headers={"User-Agent":"FoxAndMoss-download-check"})
                  with urllib.request.urlopen(req, timeout=60) as response:
                      if response.status >= 400:
                          raise SystemExit(f"{app}/{platform}: HTTP {response.status}")
          PY

      - name: Confirm page uses shared manifest
        shell: bash
        run: |
          set -euo pipefail
          grep -q "downloads/apps.json" script.js
          grep -q 'data-download-app="wordleaf"' index.html
          grep -q 'data-download-app="nalia"' index.html
          grep -q 'data-download-app="storage-guard"' index.html
